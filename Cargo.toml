[package]
name = "tagline"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Music tags, on the command line!"
repository = "https://github.com/junapur/tagline"
authors = ["June C <junapur@proton.me>"]
categories = ["command-line-utilities", "multimedia::audio"]
keywords = ["audio", "cli", "metadata", "music", "tags"]


[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.6.10", features = ["derive"] }
